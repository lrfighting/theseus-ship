services:
  - type: static
    name: theseus-ship
    runtime: static
    repo: https://github.com/lrfighting/theseus-ship
    branch: main
    buildCommand: npm install && npm run build
    publish: dist
    envVars:
      - key: VITE_API_BASE
        value: https://theseus-ship-service.onrender.com/api
